
# Root logger
rootLogger=INFO, STDOUT

# Console Appender with color
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.disableAnsi = false
appender.console.layout.pattern = %highlight{[%level]} %d{HH:mm:ss} [%t] %c - %msg%n

# Turn off TestNG internals
logger.testng.name = org.testng
logger.testng.level = warn
logger.testng.additivity = true
